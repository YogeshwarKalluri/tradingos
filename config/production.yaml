# Production configuration
app:
  log_level: "INFO"

logging:
  level: "INFO"
  console: false

market_data:
  sources:
    polygon:
      enabled: true
    alpaca:
      enabled: true

scanner:
  sources:
    file_watch:
      enabled: true
      path: "/data/scanner/inbox"
    webhook:
      enabled: true
      port: 8081

dashboard:
  host: "0.0.0.0"

model_manager:
  market_hours_models:
    - "vision_pattern"
    - "vision_detect"
    - "vision_keypoint"
    - "reasoning_llm"
    - "embed_text"
  after_hours_models:
    - "stt_whisper"
    - "diarization"
    - "chart_classify"
    - "chart_detect"
    - "ocr_paddle"
    - "extract_llm"